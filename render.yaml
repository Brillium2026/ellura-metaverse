# render.yaml
services:
  - type: web
    name: brillantmetaverse
    env: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    repo: https://github.com/yourusername/brillantmetaverse  # ← Change if needed
    branch: main
    rootDir: ./
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
